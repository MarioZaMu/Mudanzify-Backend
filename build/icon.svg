<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Mudanzify — Caja circuito</title>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="#FAF7F2"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="414" rx="134" ry="20" fill="#292524" opacity="0.10"/>

  <g transform="translate(0 -34)">
    <!-- Box faces -->
    <g stroke="#5C432B" stroke-width="5" stroke-linejoin="round">
      <path d="M256 170 L376 230 L256 290 L136 230 Z" fill="#E3C7A0"/>
      <path d="M136 230 L256 290 L256 430 L136 370 Z" fill="#C8A27A"/>
      <path d="M256 290 L376 230 L376 370 L256 430 Z" fill="#AE845C"/>
    </g>

    <!-- Shipping label on left face -->
    <path d="M158 284 L222 316 L222 356 L158 324 Z" fill="#FAF7F2" stroke="#5C432B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M168 300 L210 321 M168 313 L194 326" stroke="#A8A29E" stroke-width="4" stroke-linecap="round"/>

    <!-- Circuit tape -->
    <path d="M178 209 L214 191 L334 251 L298 269 Z" fill="#4F46E5"/>
    <path d="M298 269 L334 251 L334 391 L298 409 Z" fill="#4338CA"/>

    <!-- Traces leaving the tape -->
    <g fill="none" stroke="#4F46E5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M226 215 L256 200 L280 212"/>
      <path d="M286 245 L256 260 L232 248"/>
      <path d="M316 324 L346 309 L346 334"/>
    </g>
    <g fill="#F59E0B" stroke="#5C432B" stroke-width="3">
      <circle cx="280" cy="212" r="7"/>
      <circle cx="232" cy="248" r="7"/>
      <circle cx="346" cy="336" r="7"/>
    </g>

    <!-- Trace running along the tape -->
    <path d="M202 203 L316 260 L316 396" fill="none" stroke="#C7D2FE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#EEF2FF">
      <circle cx="226" cy="215" r="6"/>
      <circle cx="286" cy="245" r="6"/>
      <circle cx="316" cy="324" r="6"/>
      <circle cx="316" cy="372" r="6"/>
    </g>
  </g>

  <!-- AI sparkle -->
  <path d="M392 104 C392 128 398 134 422 134 C398 134 392 140 392 164 C392 140 386 134 362 134 C386 134 392 128 392 104 Z" fill="#6366F1"/>
  <path d="M352 84 C352 94 354 96 364 96 C354 96 352 98 352 108 C352 98 350 96 340 96 C350 96 352 94 352 84 Z" fill="#F59E0B"/>
</svg>
